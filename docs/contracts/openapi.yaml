openapi: 3.1.1
info:
  title: LOVE FORTUNE API contract
  version: 4.0.0
  description: "Zodiac V1 contract: SAJU + ZODIAC Lifetime, SAJU-only Daily. Advanced Astrology is
    preserved but deferred. Contract readiness is separate from incomplete production
    orchestration."
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /wp-json/love-fortune/v1
paths:
  /compatibility/calculate:
    post:
      operationId: calculateCompatibility
      summary: /compatibility/calculate
      security: []
      x-contract-status: FROZEN_READINESS_SEPARATE
      x-rate-limit:
        requests: 60
        windowSeconds: 600
        scope: Trusted proxy validated source IP, else remote address; HMAC key, never raw IP
        rawKeyMaxRetentionSeconds: 3600
        algorithm: fixed-window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/compatibility-request.schema.json
      responses:
        "200":
          description: Deterministic calculation result
          headers:
            Cache-Control:
              description: "Required: no-store"
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas/compatibility-response.schema.json
              examples:
                zodiacV1Partial:
                  summary: Synthetic partial SAJU + ZODIAC result; COMMUNICATION null
                  externalValue: ./examples/zodiac/compatibility-mixed-valid.json
        "400":
          description: Malformed request
          headers:
            Cache-Control:
              description: "Required: no-store"
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas/error.schema.json
        "404":
          description: Unknown reference
          headers:
            Cache-Control:
              description: "Required: no-store"
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas/error.schema.json
        "413":
          description: Payload too large
          headers:
            Cache-Control:
              description: "Required: no-store"
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas/error.schema.json
        "415":
          description: Unsupported media type
          headers:
            Cache-Control:
              description: "Required: no-store"
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas/error.schema.json
        "422":
          description: Semantic validation failed
          headers:
            Cache-Control:
              description: "Required: no-store"
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas/error.schema.json
        "429":
          description: Rate limit exceeded
          headers:
            Cache-Control:
              description: "Required: no-store"
              required: true
              schema:
                type: string
                const: no-store
            Retry-After:
              description: Integer seconds remaining until the current600-second fixed window ends.
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
          content:
            application/json:
              schema:
                $ref: ./schemas/error.schema.json
        "500":
          description: Internal error
          headers:
            Cache-Control:
              description: "Required: no-store"
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas/error.schema.json
        "503":
          description: Temporary calculation provider unavailable
          headers:
            Cache-Control:
              description: "Required: no-store"
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas/error.schema.json
      x-max-payload-bytes: 32768
      x-content-encoding: Any Content-Encoding header is rejected with415 UNSUPPORTED_CONTENT_ENCODING
      x-content-type: application/json or application/json; charset=utf-8 only; charset case-insensitive
